description:
  it-IT:
    localisedName: PDND QGIS Client
    shortDescription: Client QGIS per PDND
    longDescription: >-
      PDND QGIS Client è un plugin QGIS che permette di:

      - configurare connessioni PDND tramite file JSON  

      - generare automaticamente JWT e token PDND  

      - interrogare API OAS3  

      - estrarre endpoint WMS  

      - estrarre endpoint GeoJSON 

      - caricare layer WMS e GeoJSON protetti direttamente in QGIS  


      È pensato per enti pubblici, ricercatori e sviluppatori che devono
      integrare servizi geospaziali protetti tramite la Piattaforma Digitale
      Nazionale Dati (PDND).
    documentation: https://github.com/isprambiente/pdnd-qgis-client/blob/main/README.md
    features:
      - Gestione connessioni PDND (clientId, privateKey, kid, apiUrl)
      - Generazione JWT + richiesta token PDND
      - Parsing automatico del documento OAS3
      - Individuazione degli endpoint WMS
      - Individuazione degli endpoint GeoJSON
      - Caricamento dei layer nel progetto QGIS
      - Messaggi colorati tramite QGIS MessageBar
      - Gestione errori PDND (token, API, OAS3)
      - Compatibile con QGIS LTR 3.44+
      - Libreria pdnd-python-client v0.1.21 già inclusa (isprambiente/pdnd-python-client)
    screenshots:
      - docs/images/01_browser_panel.png
      - docs/images/02_browser_panel_menu.png
      - docs/images/03_config_panel_new.png
      - docs/images/04_config_panel_edit.png
      - docs/images/05_import_panel.png
      - docs/images/06_view_layers.png
